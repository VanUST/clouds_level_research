[project]
name = "clouds"
version = "0.1.0"
description = "Cloud base height estimation from stereo fisheye images, validated against a DOL-2 laser ceilometer."
authors = [
    {name = "Ivan Ustimov", email = "ustimovi@bk.ru"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyYAML>=6.0,<7.0",
    "matplotlib>=3.10.3,<4.0.0",
    "scipy>=1.16.0,<2.0.0",
    "opencv-contrib-python>=4.12.0.88,<6.0.0.0",
    "pillow>=11.3.0,<13.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "rawpy>=0.25.0,<0.26.0",
    "kornia>=0.8.1,<0.9.0",
    "scikit-learn>=1.7.0,<2.0.0",
    "pandas>=2.3.1,<4.0.0",
    "py7zr>=1.0.0,<2.0.0",
    "dtw-python>=1.4.0,<2.0.0",
    "huggingface_hub>=0.34.0,<3.0.0",
]

# Install the src/ layout as an importable package, and expose the thin CLI
# entry points under tools/ so the pipeline can be invoked without a checkout-
# relative sys.path hack.
[tool.poetry]
packages = [{ include = "clouds", from = "src" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
